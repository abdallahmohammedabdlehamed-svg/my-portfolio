<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | My Portfolio</title>

<link rel="icon" type="image/jpeg" href="../Frontend/imgs/1786145734252.jpg" />
  <link rel="apple-touch-icon" href="../Frontend/imgs/1786145734252.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", sans-serif;
      background: radial-gradient(circle at top right, #1e1548 0%, #0b0e1a 55%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #13172b;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 22px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(5, 7, 15, 0.7);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }
  
    .login-avatar-wrap {
      width: 84px;
      height: 84px;
      margin: 0 auto 16px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.35);
    }

    .login-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background-color: #0f172a;
    }

    .login-brand h1 {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 1.5rem;
      margin-bottom: 6px;
    }
    .login-brand p {
      color: #94a3b8;
      font-size: 0.88rem;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-box i {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 0.95rem;
    }
    .input-box input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: 12px;
      background: #0d1120;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      font-size: 0.92rem;
      outline: none;
      transition: 0.25s;
    }
    .input-box input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }
    .login-btn {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6d3df2 0%, #4e2ecf 100%);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(108, 60, 233, 0.4);
      transition: 0.25s;
    }
    .login-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 0.84rem;
      text-decoration: none;
    }
    .back-link:hover { color: #c4b5fd; }

    .login-btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
     <div class="login-avatar-wrap">
  <img
    src="../Frontend/imgs/1786145734252.jpg"
    alt="Abdallah Mohamed"
    class="login-avatar"
    id="loginAdminAvatar"
    onerror="this.src='https://ui-avatars.com/api/?name=Abdallah+Mohamed&background=6d28d9&color=fff&bold=true'"
  />
</div>
      <h1>Admin Login</h1>
      <p>Sign in to manage your portfolio</p>
    </div>

    <div class="error-msg" id="loginError"></div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label for="adminEmail">Email Address</label>
        <div class="input-box">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="adminEmail" placeholder="admin@abdallah.dev" required />
        </div>
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="adminPassword" placeholder="••••••••" required />
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginSubmitBtn">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
      </button>
    </form>

    <a href="../Frontend/index.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Portfolio
    </a>
  </div>

  <script>
    const API_BASE = window.location.port === "5500" ? "http://localhost:5000/api" : "/api";
    // لو مسجل دخول بالفعل ادخل على الداشبورد مباشرة
    if (localStorage.getItem("portfolioAdminToken")) {
      window.location.href = "dashboard.html";
    }

    document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("adminEmail").value;
      const password = document.getElementById("adminPassword").value;
      const errorBox = document.getElementById("loginError");
      const btn = document.getElementById("loginSubmitBtn");

      errorBox.style.display = "none";
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem("portfolioAdminToken", data.token);
          localStorage.setItem("portfolioAdminUser", JSON.stringify(data.admin));
          window.location.href = "dashboard.html";
        } else {
          errorBox.textContent = data.message || "Invalid credentials";
          errorBox.style.display = "block";
        }
      } catch (err) {
        errorBox.textContent = "Cannot connect to server. Make sure backend is running.";
        errorBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard';
      }
    });

    async function loadAdminLoginAvatar() {
      const avatarImg = document.getElementById("loginAdminAvatar");
      if (!avatarImg) return;

      const cachedAdmin = JSON.parse(localStorage.getItem("portfolioAdminUser") || "{}");
      if (cachedAdmin.avatar) {
        avatarImg.src = cachedAdmin.avatar;
      }

      try {
        const res = await fetch(`${API_BASE}/admin/profile`);
        const data = await res.json();
        if (data.success && data.admin?.avatar) {
          avatarImg.src = data.admin.avatar;
        }
      } catch (err) {
        // تبقى الصورة الافتراضية ظاهرة في حال عدم اتصال السيرفر
      }
    }

    loadAdminLoginAvatar();
  </script>
</body>
</html>
